# Credential protection. Read/Edit rules are merged into ~/.claude/settings.json `permissions`
# (your own entries stay); Bash access to the same files is denied by core/hooks/harness_guards.py.
[claude]
deny = [
  "Read(~/.ssh/id_rsa)", "Read(~/.ssh/id_ed25519)", "Read(~/.ssh/id_ecdsa)", "Read(~/.ssh/id_dsa)",
  "Read(~/.ssh/*.pem)", "Read(~/.ssh/*_key)",
  "Read(~/.aws/**)", "Read(~/.gnupg/**)", "Read(~/.netrc)", "Read(~/.docker/config.json)",
  "Read(~/.kube/config)", "Read(~/.config/gh/hosts.yml)", "Read(~/.codex/auth.json)",
  "Read(~/.pi/agent/auth.json)",
  "Edit(~/.ssh/**)", "Edit(~/.aws/**)", "Edit(~/.gnupg/**)", "Edit(~/.netrc)",
]
ask = ["Read(**/.env)", "Read(**/.env.*)"]
# Engram's PreToolUse hook rewrites session_id, and auto mode rejects calls a hook modified
# after review. Writes only: mem_delete and mem_merge_projects still go through review.
allow = [
  "mcp__engram__mem_save", "mcp__engram__mem_update", "mcp__engram__mem_session_summary",
  "mcp__engram__mem_save_prompt", "mcp__engram__mem_session_start", "mcp__engram__mem_session_end",
  "mcp__engram__mem_judge", "mcp__engram__mem_compare", "mcp__engram__mem_capture_passive",
  "mcp__plugin_engram_engram__mem_save", "mcp__plugin_engram_engram__mem_update",
  "mcp__plugin_engram_engram__mem_session_summary", "mcp__plugin_engram_engram__mem_save_prompt",
  "mcp__plugin_engram_engram__mem_session_start", "mcp__plugin_engram_engram__mem_session_end",
  "mcp__plugin_engram_engram__mem_judge", "mcp__plugin_engram_engram__mem_compare",
  "mcp__plugin_engram_engram__mem_capture_passive",
]

[codex]
# Secrets that must come from the environment (Keychain via a LaunchAgent), never from config.toml.
remove_env = ["ENGRAM_CLOUD_TOKEN"]
# Codex gives stdio MCP servers a minimal environment; these variables are passed through by name.
pass_env = { engram = ["ENGRAM_CLOUD_TOKEN"] }

[opencode]
# Native OpenCode approval prompts (permission.bash), matching the Codex execpolicy prompts.
ask = [
  "git push*", "ssh *", "scp *", "sftp *", "mosh *",
  "gh pr create*", "gh pr merge*", "gh pr close*", "gh pr ready*", "gh pr comment*", "gh pr review*",
  "gh release create*", "gh repo create*", "gh repo delete*", "gh workflow run*",
  "npm publish*", "pnpm publish*", "yarn publish*",
  "wrangler deploy*", "wrangler pages deploy*", "netlify deploy*", "fly deploy*", "vercel*",
  "codegraph index*",
]
