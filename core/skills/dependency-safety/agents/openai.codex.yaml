interface:
  display_name: "Dependency Safety"
  short_description: "Validate dependency docs, versions, and supply-chain risk"
  default_prompt: "Use $dependency-safety to validate this dependency change with Context7, official stable-release evidence, and supply-chain security checks before implementation."

dependencies:
  tools:
    - type: "mcp"
      value: "context7"
      description: "Current documentation for external libraries, frameworks, SDKs, APIs, and CLI tools"
      transport: "streamable_http"
      url: "https://mcp.context7.com/mcp"
